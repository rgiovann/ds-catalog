spring.profiles.active=${APP_PROFILE:test}

spring.output.ansi.enabled=NEVER

spring.jpa.open-in-view=false
# Ativa logs detalhados do Spring Security
 logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.security.authentication=DEBUG
logging.level.org.springframework.security.core.userdetails=DEBUG
# Ativa logs detalhados do Spring Authorization Server
logging.level.org.springframework.security.oauth2=TRACE
logging.level.com.nimbusds.jose=TRACE
logging.level.org.springframework.security=DEBUG

# spring.main.allow-circular-references=true

cors.origins=${CORS_ORIGINS:https://devsuperior.com.br,http://localhost:3000,http://localhost:5173}

keycloak.client-id=dscatalog-client
keycloak.redirect-uri=http://localhost:8080/keycloack/auth/callback
keycloak.token-endpoint=http://localhost:8081/realms/dscatalog-realm/protocol/openid-connect/token
keycloak.issuer-uri=http://localhost:8081/realms/dscatalog-realm
keycloak.certs-endpoint=http://localhost:8081/realms/dscatalog-realm/protocol/openid-connect/certs


spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER


